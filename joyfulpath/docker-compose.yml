version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: joyfulpath_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-joyfulpath}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - joyfulpath_network

  redis:
    image: redis:7-alpine
    container_name: joyfulpath_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - joyfulpath_network
    command: redis-server --appendonly yes

  pgadmin:
    image: dpage/pgadmin4
    container_name: joyfulpath_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@joyfulpath.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - joyfulpath_network

  api:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    container_name: joyfulpath_api
    restart: unless-stopped
    ports:
      - "3001:3000"
    depends_on:
      - postgres
      - redis
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-joyfulpath}?schema=public
      - REDIS_URL=redis://redis:6379
    networks:
      - joyfulpath_network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: joyfulpath_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    networks:
      - joyfulpath_network

volumes:
  postgres_data:
  redis_data:

networks:
  joyfulpath_network:
    driver: bridge
