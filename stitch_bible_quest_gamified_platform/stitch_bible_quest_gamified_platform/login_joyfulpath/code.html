<!-- Login Card Container -->
<main class="relative z-10 w-full max-w-[480px]">
<div class="bg-surface-container-lowest rounded-xl shadow-[0_4px_12px_rgba(0,88,190,0.12)] p-8 md:p-12 border border-outline-variant">
<!-- Logo and Header -->
<div class="text-center mb-10">
<div class="inline-flex items-center justify-center w-20 h-20 bg-primary-container rounded-xl mb-6 shadow-sm">
<span class="material-symbols-outlined text-on-primary-container !text-4xl" style="font-variation-settings: 'FILL' 1;">church</span>

<h1 class="font-headline-lg text-headline-lg text-primary mb-2">JoyfulPath</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Welcome back, Young Explorer!</p>
</div>
<!-- Login Form -->
<form action="#" class="space-y-6" onsubmit="return false;">
<!-- Email Field -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full h-14 pl-12 pr-4 bg-surface-container rounded-lg border-2 border-transparent focus:border-primary focus:ring-0 transition-colors font-body-md text-on-surface outline-none placeholder:text-outline-variant" id="email" name="email" placeholder="explorer@path.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="block font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:underline" href="#">Forgot?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full h-14 pl-12 pr-12 bg-surface-container rounded-lg border-2 border-transparent focus:border-primary focus:ring-0 transition-colors font-body-md text-on-surface outline-none placeholder:text-outline-variant" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Remember Me & Actions -->
<div class="flex items-center justify-between">
<label class="flex items-center group cursor-pointer">
<div class="relative flex items-center">
<input class="peer hidden" type="checkbox"/>
<div class="w-6 h-6 rounded-md border-2 border-outline-variant bg-surface group-hover:border-primary peer-checked:bg-primary peer-checked:border-primary transition-all flex items-center justify-center">
<span class="material-symbols-outlined text-white text-sm scale-0 peer-checked:scale-100 transition-transform">check</span>
</div>
<span class="ml-3 font-body-md text-body-md text-on-surface-variant group-hover:text-on-surface transition-colors">Remember Me</span>
</div>
</label>
</div>
<!-- Submit Button -->
<div class="pt-4">
<button class="tactile-button w-full h-14 bg-primary text-on-primary font-button-text text-button-text rounded-xl flex items-center justify-center gap-2 hover:bg-primary-container transition-colors" type="submit">
<span>Login to Path</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</form>
<!-- Secondary Actions -->

<p class="font-body-md text-body-md text-on-surface-variant mb-4">New to JoyfulPath?</p>
<a class="inline-flex items-center justify-center px-8 h-12 rounded-lg border-2 border-primary text-primary font-label-md text-label-md hover:bg-primary hover:text-on-primary transition-all" href="#">
                    Create Student Account
                </a>
</div>
</div>
<!-- Footer Help -->
<div class="mt-8 flex justify-center gap-6">
<a class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors flex items-center gap-1" href="#">
<span class="material-symbols-outlined !text-base">help</span>
                Need help?
            </a>
<a class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors flex items-center gap-1" href="#">
<span class="material-symbols-outlined !text-base">shield</span>
                Privacy Policy
            </a>
</div>
</main>
<script>
        // Simple interactivity for the login button and inputs
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('input');
            inputs.forEach(input => {
                input.addEventListener('focus', () => {
                    input.parentElement.parentElement.classList.add('scale-[1.01]');
                    input.parentElement.parentElement.style.transition = 'transform 0.2s ease';
                });
                input.addEventListener('blur', () => {
                    input.parentElement.parentElement.classList.remove('scale-[1.01]');
                });
            });

            // Password visibility toggle
            const togglePass = document.querySelector('button[type="button"]');
            const passInput = document.getElementById('password');
            if (togglePass && passInput) {
                togglePass.addEventListener('click', () => {
                    const isPass = passInput.type === 'password';
                    passInput.type = isPass ? 'text' : 'password';
                    togglePass.querySelector('span').textContent = isPass ? 'visibility_off' : 'visibility';
                });
            }
        });
    </script>
